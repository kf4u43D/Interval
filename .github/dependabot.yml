version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      kotlin-androidx:
        patterns:
          - "org.jetbrains.kotlin*"
          - "androidx.*"
          - "org.jetbrains.kotlinx*"
      build-tooling:
        patterns:
          - "com.android.*"
          - "com.google.oboe:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
